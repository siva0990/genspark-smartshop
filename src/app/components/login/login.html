<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-logo">
          <i class="bi bi-bag-heart-fill"></i>
        </div>
        <h2>SmartShop Portal</h2>
        <p>Sign in to access your dashboard and products</p>
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger d-flex align-items-center" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <div>{{ errorMessage() }}</div>
        </div>
      }

      <form (ngSubmit)="handleLoginClick()" class="login-form">
        <div class="form-group mb-4">
          <label for="username">
            <i class="bi bi-person-fill"></i> Username
          </label>
          <input 
            type="text" 
            id="username" 
            class="form-control" 
            placeholder="Enter your username (e.g. emilys)"
            [formField]="loginForm.username"
          >
          @for (error of loginForm.username().errors(); track error.message) {
            <div class="error-msg">
              <i class="bi bi-info-circle"></i> {{ error.message }}
            </div>
          }
        </div>

        <div class="form-group mb-4">
          <label for="password">
            <i class="bi bi-lock-fill"></i> Password
          </label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter your password"
            [formField]="loginForm.password"
          >
          @for (error of loginForm.password().errors(); track error.message) {
            <div class="error-msg">
              <i class="bi bi-info-circle"></i> {{ error.message }}
            </div>
          }
        </div>

        <button 
          [disabled]="progress() || loginForm().invalid()" 
          type="submit" 
          class="btn btn-login w-100"
        >
          @if (progress()) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Signing In...
          } @else {
            Sign In <i class="bi bi-arrow-right-short ms-1"></i>
          }
        </button>
      </form>
    </div>
  </div>
</div>
